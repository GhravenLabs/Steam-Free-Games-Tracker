name: Smoke

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile and verify static output
        run: |
          python -m py_compile steam_free.py
          python steam_free.py --help > /tmp/steam-help.txt
          test -s /tmp/steam-help.txt
          python - <<'PY'
          import steam_free
          html = steam_free.build_html([{
              "title": "Demo Game",
              "worth": "$9.99",
              "ends": "Limited time",
              "url": "https://store.steampowered.com/",
              "img": "",
              "source": "Smoke fixture",
          }])
          assert "Demo Game" in html
          assert "Claim free" in html
          PY
          test -f assets/screenshot.png
