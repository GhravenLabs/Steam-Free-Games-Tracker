name: Smoke

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile and verify static output
        run: |
          python -m py_compile steam_free.py
          python steam_free.py --help | grep -q "Find free"
          test -f steam-free-games.html
          test -f assets/screenshot.png
